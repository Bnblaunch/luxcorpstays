const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function initials(n){return (n||'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'A';}
function logoMarkup(cls){
  if(cfg.logo) return `<img class="${cls} lg-img" src="${cfg.logo}" alt="${esc(cfg.name)} logo">`;
  return `<span class="${cls} lg-mono">${esc(initials(cfg.name))}</span>`;
}
/* Stock photo helper — high-quality photo first, auto-falls back to a keyword-matched
   real photo if that URL ever fails, and a branded gradient sits behind it either way.
   Clients never upload anything; photography ships with the template. */
function stock(u,kw,cls,w,h){
  const fb="https://loremflickr.com/"+w+"/"+h+"/"+kw;
  return `<img class="${cls}" alt="" loading="lazy" src="${u}" data-fb="${fb}" onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb='';}else{this.style.display='none';}">`;
}

const RENDERERS={classic:tpl_classic,aurora:tpl_aurora,haven:tpl_haven,summit:tpl_summit};
function buildSite(){return (RENDERERS[cfg.template]||tpl_aurora)();}
function notFound(){return '<body style="font-family:system-ui,sans-serif;display:grid;place-items:center;height:100vh;margin:0;background:#f6f4fb;color:#33313d"><div style="text-align:center"><div style="font-size:40px">\u{1F50D}</div><h2 style="font-family:Georgia,serif">Site not found</h2><p style="color:#6b6785">This website has not been published yet.</p></div></body>';}
(async()=>{
  try{
    if(!window.SUPABASE_URL||/YOUR-PROJECT-REF/.test(window.SUPABASE_URL||'')){document.body.innerHTML='<div style="padding:40px;font-family:system-ui">Add your Supabase URL + anon key to config.js.</div>';return;}
    const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
    const param=(new URLSearchParams(location.search).get('s')||'').replace(/[^a-z0-9-]/gi,'');
    const host=(location.hostname||'').toLowerCase();
    const base=(window.SITE_BASE_DOMAIN||'').toLowerCase();  // e.g. "sites.bnblaunch.io" or "yourbrand.com"
    const bySlug=async s=>(await sb.from('sites_public').select('*').eq('slug',s).limit(1).maybeSingle()).data;
    const byDomain=async d=>(await sb.from('sites_public').select('*').eq('custom_domain',d).limit(1).maybeSingle()).data;
    let data=null;
    if(param){                                              // ?s=slug  (preview / share link)
      data=await bySlug(param);
    } else if(base && host!==base && host!=='www.'+base && host.endsWith('.'+base)){
      data=await bySlug(host.slice(0,host.length-base.length-1).split('.')[0]);  // slug.yourbrand.com
    } else if(base && (host===base||host==='www.'+base)){
      data=null;                                            // the root domain itself — not a client site
    } else {                                                // a client's own custom domain
      data=await byDomain(host) || (host.startsWith('www.')?await byDomain(host.slice(4)):null);
    }
    if(!data){document.open();document.write(notFound());document.close();return;}
    cfg={template:data.template||'classic',primary:data.primary_color||'#6d28d9',accent:data.accent_color||'#a855f7',name:data.company||'',head:data.headline||'',sub:data.subhead||'',about:data.about||'',email:data.email||'',phone:data.phone||'',city:data.city||'',logo:data.logo||null,services:Array.isArray(data.services)?data.services:[]};
    document.open();document.write(buildSite());document.close();
  }catch(e){document.open();document.write(notFound());document.close();}
})();
</script>
